# Default values for factory-tycoon-websocket
replicaCount: 2

image:
  repository: 613307913976.dkr.ecr.ap-northeast-2.amazonaws.com/sf-backend-websocket
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  name: sf-backend-websocket

nodeSelector:
  role: backend

configMap:
  enabled: false  # Managed by Terraform
  name: sf-backend-websocket-config
  data: {}

secret:
  enabled: false  # Managed by Terraform
  name: sf-backend-websocket-secrets
  # These should be injected via Terraform or external secret management
  # data:
  #   REDIS_HOST: ""
  #   REDIS_STREAM_KEY: ""
  #   CONSUMER_GROUP: ""
  #   CONSUMER_NAME: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  tcpSocket:
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  tcpSocket:
    port: 8000
  initialDelaySeconds: 20
  periodSeconds: 5
