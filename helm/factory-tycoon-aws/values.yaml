# Default values for factory-tycoon-aws
replicaCount: 2

image:
  repository: 809808214826.dkr.ecr.ap-northeast-2.amazonaws.com/sf-backend-aws
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081
  name: sf-backend-aws

nodeSelector:
  role: backend

# IRSA (IAM Roles for Service Accounts)
serviceAccount:
  create: true
  name: sf-backend-aws-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::809808214826:role/sf-backend-aws-irsa"

configMap:
  enabled: false  # Managed by Terraform
  name: sf-backend-aws-config
  data:
    SERVER_PORT: "8081"
    AWS_REGION: "ap-northeast-2"

secret:
  enabled: false  # Managed by Terraform
  name: sf-backend-aws-secrets
  # These should be injected via Terraform or external secret management
  # data:
  #   AWS_ACCESS_KEY: ""
  #   AWS_SECRET_KEY: ""
  #   AWS_BUCKET: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8081
  initialDelaySeconds: 20
  periodSeconds: 5
# OpenSearch Security Setup (initContainer)
initContainers:
  opensearchSecuritySetup:
    enabled: true
    image: curlimages/curl:latest
    irsaRoleArn: "arn:aws:iam::809808214826:role/sf-backend-aws-irsa"
