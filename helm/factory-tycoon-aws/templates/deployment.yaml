apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "factory-tycoon-aws.fullname" . }}
  labels:
    {{- include "factory-tycoon-aws.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "factory-tycoon-aws.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "factory-tycoon-aws.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.initContainers.opensearchSecuritySetup.enabled }}
      initContainers:
        - name: opensearch-security-setup
          image: {{ .Values.initContainers.opensearchSecuritySetup.image }}
          securityContext:
            runAsUser: 0
          env:
            - name: IRSA_ROLE_ARN
              value: {{ .Values.initContainers.opensearchSecuritySetup.irsaRoleArn | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          command:
            - /bin/sh
            - -c
            - |
              #!/bin/sh
              set -e
              
              echo "Starting OpenSearch security setup..."
              
              # Install required tools
              apk add --no-cache curl jq aws-cli bash
              
              ENDPOINT="https://${OPENSEARCH_ENDPOINT}"
              ROLE_NAME="sensor-data-reader"
              AWS_REGION="${AWS_REGION:-ap-northeast-2}"
              
              echo "Creating sensor-data-reader role..."
              
              # Create the role using master user credentials
              curl -X PUT "${ENDPOINT}/_plugins/_security/api/roles/${ROLE_NAME}" \
                -H "Content-Type: application/json" \
                -u "${OPENSEARCH_USER}:${OPENSEARCH_PASSWORD}" \
                -d '{
                  "cluster_permissions": ["cluster_composite_ops_ro"],
                  "index_permissions": [{
                    "index_patterns": ["sensor-data"],
                    "allowed_actions": ["read", "search"]
                  }]
                }' --insecure || echo "Role creation failed or already exists"
              
              echo "Mapping IRSA role to OpenSearch role..."
              
              # Map the backend role using master user credentials
              curl -X PUT "${ENDPOINT}/_plugins/_security/api/rolesmapping/${ROLE_NAME}" \
                -H "Content-Type: application/json" \
                -u "${OPENSEARCH_USER}:${OPENSEARCH_PASSWORD}" \
                -d "{
                  \"backend_roles\": [\"${IRSA_ROLE_ARN}\"]
                }" --insecure || echo "Role mapping failed or already exists"
              
              echo "OpenSearch security setup completed!"
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
            - configMapRef:
                name: {{ .Values.configMap.name }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
