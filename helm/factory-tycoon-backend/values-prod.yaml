# Values for Production environment
replicaCount: 2

image:
  tag: "b411b27cd6257bc5e07a2dcdfde0961d48b2f9dc"  # 현재 태그로 업데이트

# ConfigMap and Secret are managed by Terraform
configMap:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
