apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-backend-glb
  labels:
    app: sf-backend-glb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sf-backend-glb
  template:
    metadata:
      labels:
        app: sf-backend-glb
    spec:
      nodeSelector:
        role: backend
      serviceAccountName: sf-backend-glb-sa
      containers:
        - name: sf-backend-glb
          image: 613307913976.dkr.ecr.ap-northeast-2.amazonaws.com/sf-backend-glb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"

            - name: AWS_REGION
              value: ap-northeast-2
              
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2
              
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: glb-aws-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: glb-aws-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: glb-aws-secret
                  key: AWS_BUCKET
