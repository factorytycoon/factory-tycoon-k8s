apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-backend-glb
  labels:
    app: sf-backend-glb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sf-backend-glb
  template:
    metadata:
      labels:
        app: sf-backend-glb
    spec:
      nodeSelector:
        role: backend
      serviceAccountName: sf-backend-glb-sa
      containers:
        - name: sf-backend-glb
          image: 613307913976.dkr.ecr.ap-northeast-2.amazonaws.com/sf-backend-glb:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: sf-backend-glb-secrets
            - configMapRef:
                name: sf-backend-glb-config
                
