apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-backend
  labels:
    app: sf-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sf-backend
  template:
    metadata:
      labels:
        app: sf-backend
    spec:
      nodeSelector:
        role: backend
      containers:
        - name: sf-backend
          image: 613307913976.dkr.ecr.ap-northeast-2.amazonaws.com/sf-backend:4710343a873dd115cd123955595be6681cca6521
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: MARIADB_URL
              value: "jdbc:mysql://175.114.229.158:3306/factory-tycoon"
            - name: MARIADB_USERNAME
              value: "user"
            - name: MARIADB_PASSWORD
              value: "1234"
            - name: AWS_REGION
              value: ap-northeast-2
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2