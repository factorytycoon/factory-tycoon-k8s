apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-deployment
  namespace: factory-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fe
  template:
    metadata:
      labels:
        app: fe
    spec:
      nodeSelector:
        role: frontend
      containers:
        - name: fe
          image: nginx   
          ports:
            - containerPort: 3000
