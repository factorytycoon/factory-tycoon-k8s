apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: factory-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # TLS 비활성화: ACM 미보유로 ssl-redirect 비활성화
    alb.ingress.kubernetes.io/backend-protocol: "HTTP"
    # WebSocket 지원을 위한 타임아웃 설정
    alb.ingress.kubernetes.io/idle-timeout: "3600"
    # WebSocket 연결 유지
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=3600
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sf-backend
                port:
                  number: 8080
          - path: /aws
            pathType: Prefix
            backend:
              service:
                name: sf-backend-aws
                port:
                  number: 8081
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: sf-backend-websocket
                port:
                  number: 8000
