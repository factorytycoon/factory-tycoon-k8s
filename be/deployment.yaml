apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-backend
  labels:
    app: sf-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sf-backend
  template:
    metadata:
      labels:
        app: sf-backend
    spec:
      containers:
        - name: sf-backend
          image: 613307913976.dkr.ecr.ap-northeast-2.amazonaws.com/sf-backend:4710343a873dd115cd123955595be6681cca6521
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
